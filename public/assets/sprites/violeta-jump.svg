  <desc>Fotograma adult-jump-2 recortado de la lámina original de velociraptores. Fondo blanco convertido a transparencia; se conserva el arte fuente.</desc>
  <defs>
    <filter id="white-key" x="0" y="0" width="1264" height="843" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>

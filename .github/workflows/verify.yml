name: Verify campaign and game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run campaign and environment regression tests
        run: >-
          node --test
          tests/campaign.test.js
          tests/campaign-prologue.test.js
          tests/campaign-narration.test.js
          tests/save-manager.test.js
          tests/collectibles.test.js
          tests/checkpoints.test.js
          tests/hunter-projectiles.test.js
          tests/hunting.test.js
          tests/environment-assets.test.js
          tests/image-parallax.test.js
          tests/minigame-environments.test.js
          tests/combats.test.js
      - name: Build production bundle
        run: npm run build

name: Verify campaign and game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Haxe toolchain
        run: source scripts/install-haxe.sh
      - name: Compile HaxeFlixel minigames for HTML5
        run: bash scripts/build-haxeflixel.sh
      - name: Run campaign regression tests
        run: >-
          node --test
          tests/campaign.test.js
          tests/campaign-prologue.test.js
          tests/campaign-narration.test.js
          tests/save-manager.test.js
          tests/collectibles.test.js
          tests/checkpoints.test.js
      - name: Build production bundle
        run: VITE_HAXEFLIXEL=1 npm run build
